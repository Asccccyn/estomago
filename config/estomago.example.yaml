# estómago v0.2.1 应用配置草案；不是 SDK 原始 options。所有现场 null 必须核实。
# 明确映射 options / inline settings / env 并探测实际生效；未知不得冒充 false 或已支持。
# effort、返回摘要、UI展开独立；私有材料和凭据不在此包。
project:
  display_name: estómago
  slug: estomago
  spec_version: '0.2.1'
deployment:
  target_os: macOS
  source_root: ~/Projects/estomago
  state_root: ~/Library/Application Support/estomago
  log_root: ~/Library/Logs/estomago
  bind: 127.0.0.1
  port: 18787
  public_origin: null
  public_enabled: false
  supervisor: launchagent
runtime:
  # 新窗口按需读取详细工具定义；既有窗口沿用已发送的冻结工具集。
  tool_schema_mode: deferred
  provider: claude-agent-sdk
  language: typescript
  node_version: null
  sdk_version: null
  runtime_version: null
  model: null
  authentication_profile_ref: null
  system_prompt_mode: explicit_custom
  setting_sources: []
  require_identity_manifest: true
  disable_auto_memory: true
  strict_mcp_config: true
  automatic_flag_switch: false
  automatic_availability_fallbacks: []
  max_active_primary_runners: 1
  builtin_tools: []
  mcp_servers_allowlist: []
  skills: []
  plugins: []
  disable_claude_ai_connectors: true
  include_partial_messages: true
  thinking:
    mode: adaptive
    display: summarized
    effort: null
    require_capability_probe: true
  config_isolation_root: null
  auth_and_billing_verified: false
  capability_state: unknown
identity:
  # F04：能力探针证据有效期（天）——过期观测按 stale 阻断；null=不按时间过期
  probe_evidence_max_age_days: null
  approved_identity_ref: null
  approved_identity_hash: null
  i_source: mariposa
  allow_unverified_fallback: false
  require_bootstrap_receipt: true
  receipt_requires_evidence: true
  unobservable_fields_are_unknown: true
windows:
  # ESTOMAGO_OR_SELF_HOLD §4：换窗容量预算（工程初值，非上游极限）。
  # 有效软线 = min(soft, C-O-T-R-S)。唯一自动换窗基线=容量软线（600k 兜底）——
  # 6h 静默（idle_before_next_user_ms）、零点换窗（rotate_on_business_
  # date_change）、bootstrap_target_tokens、warning_tokens、digest 段、
  # recent_dialogue_budget_tokens 均已退役（WP-03/WP5，2026-10-09）；
  # 旧配置带这些键会在启动日志披露为 retired_config_keys（不静默接受）
  soft_limit_tokens: 600000       # 自动换窗最高上限兜底（她 2026-10-17 裁定：64k→600k，模型容量 1M；手动换窗随时可换不受限）
  ui_reference_tokens: 128000     # 前台容量圈参考线（她 2026-10-19 裁定：纯视觉，超出标红不阻断；可调）
  tool_input_reserve_tokens: 8000    # T：有界后续工具输入预留
  review_reserve_tokens: 8000        # R：换窗提醒及必要 hold 往返预留
  safety_reserve_tokens: 4000        # S：安全余量
  model_context_capacity: null    # C：由实际模型/端点能力补齐；null=未测量
  threshold_status: awaiting_measurement
  normal_rotation_uses_new_session: true

# 换窗 hold 提醒开关（她裁定 2026-10-07；WP5 起只管提醒——日结已退役）
reminders:
  enabled: true

# OR 型号候选（设置页下拉数据源；空=手填；免费公开元数据无私人数据）
openrouter:
  model_options: []

# OpenRouter 主接入（ESTOMAGO_OR_SELF_HOLD §6）：与 SDK 认证/装配完全分离。
# model=null 表示"模型未配置"（运行时如实阻断，不猜默认型号）；key 只经环境变量名引用。
openrouter:
  base_url: https://openrouter.ai/api/v1
  model: null                     # 明确 OR model ID（如 anthropic/claude-…）；禁止 auto/latest
  api_key_env: OPENROUTER_API_KEY # 只在后端读取；不进前端/日志/Git
  max_output_tokens: 8192         # 无既有批准值时的透明初值；设置页可改
  provider_only:
    - anthropic
  allow_fallbacks: false          # 硬规则
  require_parameters: true        # 硬规则
  cache_ttl: 1h                   # 硬规则：一小时显式缓存
  disable_context_compression: true  # 硬规则：显式关闭 OR 上下文压缩插件
  retry_max_attempts_after_initial: 2
  reasoning: null                 # 未批准的推理覆盖保持 null；不照搬 SDK effort 字符串
  estimate_chars_per_token: 2.5   # §11.1 输入粗估系数（拉丁文本≈2.5；有真实 usage 校准兜底）
  vision_supported_models: []     # 2026-10-18：人工确认支持图片输入的型号（如 anthropic/claude-opus-4.6）；声明命中=媒体门直接放行，跳过运行时目录核实（目录查询失败曾连续阻断发图）

# DeepSeek 官方直连驱动（2026-10-05 裁定：DS 官方 key 不经 OpenRouter；runtime.provider: deepseek 时启用）。
# 身份映射隔离：session 派生/上下文指纹/凭据与 openrouter 段完全独立，切换驱动强制换窗。
# DS 自动上下文缓存——无 cache_control/provider/plugins 等参数（命中看 usage 的 prompt_cache_hit_tokens）。
deepseek:
  base_url: https://api.deepseek.com
  model: null                     # DS 官方单段型号（如 deepseek-chat / deepseek-reasoner）；null=未配置阻断
  api_key_env: DEEPSEEK_API_KEY   # DeepSeek 官方平台的 key；只在后端读取；不进前端/日志/Git
  max_output_tokens: 8192
  retry_max_attempts_after_initial: 2
  estimate_chars_per_token: 1.5   # 中文对话为主的粗估系数（§11.1 估计带精度，usage 校准兜底）
time:
  business_timezone: Asia/Shanghai
  persist_absolute_time_as: UTC
  refresh_before_every_turn: true
  use_device_timezone_to_rewrite_history: false
  injection_channel: per_turn_context_or_verified_hook
  depend_on_system_prompt_cache_boundary: false
routing:
  require_owner_decision: true
  decision_survives_restart: true
  unsupported_signal_behavior: unknown_no_claim
  continue_capability: unknown
archive:
  enabled: false
  continuous_grant_ref: null
  source_scope: null
  semantic_auto_binding_threshold: null
  semantic_auto_binding_enabled: false
# 媒体 embedding worker（JOINT-VOICE-20261022；未配置=图片语义检索不可用，聊天不受影响）
# media_embedding:
#   base_url: http://127.0.0.1:8792

integrations:
  mariposa:
    base_url: null
    # credential_ref=主模型能力凭据（memory.hold 等）；archive_credential_ref=归档 worker 的
    # 受限 stream 凭据（审计 F11/LC-050：生产必须分离——归档不得持业务写凭据）
    credential_ref: null
    archive_credential_ref: null
    contract_version: null
  # oído 深听（JOINT-VOICE-20261022）：未配置=听觉不可用，无转写语音保持阻断语义
  oido:
    base_url: null
    credential_ref: null
    # base_url: http://127.0.0.1:8791
    # credential_ref: ESTOMAGO_OIDO_TOKEN   # 环境变量名（值绝不入配置/日志）
  siren:
    base_url: null
    credential_ref: null
    contract_version: null
  superposition:
    base_url: null
    credential_ref: null
    contract_version: null
  zashidele:
    base_url: null
    credential_ref: null
    contract_version: null
notifications:
  remote_enabled: false
  provider: null
  credential_ref: null
  aggregate_by_turn: true
  include_sensitive_content: false
  telegram_enabled: false
signals:
  enabled: false
  consent_ref: null
  share_with_model: false
  share_with_groups: false
safety:
  default_deny_unregistered_capabilities: true
  allow_unrestricted_shell: false
  production_side_effects_enabled: false
  test_root_must_differ_from_production: true

input:
  multiline: true
  enter_behavior: newline
  send_control: dedicated_button
  keyboard_send_shortcuts_enabled: false
  ime_composition_guard: true
  normalize_newlines_to: LF
  split_user_message_on_newline: false

reasoning:
  requested: true
  label: 思考
  label_is_design_proposal: true
  default_expanded: false
  capture_source: sdk_partial_events
  complete_block_action: reconcile_not_append
  store_separately_from_messages: true
  persist_readable_projection: true
  retention_policy: with_conversation_local_only
  auto_delete_days: null
  maximum_buffer_bytes: null
  maximum_trace_bytes: null
  limits_status: awaiting_measurement
  signature_to_ui: false
  archive_to_mariposa: false
  include_in_handoff: false
  tts_enabled: false
  push_enabled: false
  auto_rewrite_with_model: false
  stop_transcript_main_capture: false
  capability_state: unknown

# —— ESTOMAGO_CHAT_EXEC_V1 新增段（policy-defaults.json adjustable 面）——
# autonomous/keepwarm 首版默认关闭；daily_cost_cap_usd: null=未配置（该用途后台付费
# 禁止），不是无限。保温间隔50min与分页上限等固定策略在policy-constants.ts。
# 自主60min冷却、心跳单请求/禁工具等旧限制已退役。工具沿用现有授权；费用由可信报价和金额cap约束。
background:
  autonomous:
    enabled: false
    max_model_requests_per_run: 4
    max_output_tokens_per_run: 4096
    max_tool_calls_per_run: 8
    max_run_ms: 120000
    daily_cost_cap_usd: null
  keepwarm:
    enabled: false
    # 旧纯保温输出/时限键已退役；实际使用主回合输出和正常后台运行时限。
    daily_cost_cap_usd: null
    # 可按实际作息修改；开始含、结束不含。仅阻止系统心跳，不影响显式自主预约。
    sleep_window:
      enabled: true
      start: '23:00'
      end: '08:00'
      timezone: 'Asia/Shanghai'
  reminders:
    enabled: true
    delivery_grace_ms: 300000
    default_local_time: '09:00'
content:
  enabled: false
  port: 18788
system_alerts:
  usage_settlement_grace_ms: 60000
  summary_refresh_debounce_ms: 1000
token_estimates:
  debounce_ms: 250
  max_body_bytes: 524288
media:
  max_image_bytes: 20971520
  max_audio_bytes: 33554432
  max_video_bytes: 67108864
  max_code_artifact_bytes: 262144
  max_attachments_per_message: 8
  import_timeout_ms: 30000
  max_redirects: 3
  auto_physical_gc_enabled: false
