<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>estómago</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">estómago</span>
    <span id="runtime-badge" class="badge">连接中…</span>
    <button id="records-btn" class="ghost" hidden>记录</button>
    <button id="alerts-btn" class="ghost" hidden aria-label="系统通知（异常中心）">系统通知<span id="alerts-badge" class="alerts-badge" hidden></span></button>
    <button id="login-btn" class="ghost" hidden>登录</button>
  </header>

  <aside id="records-panel" class="records-panel" hidden aria-label="记录面板">
    <div class="records-head">
      <strong>记录</strong>
      <button id="records-close" class="ghost">关闭</button>
    </div>
    <div id="records-body" class="records-body">
      <p class="muted">打开面板只查询，不会触发模型调用、记忆写入或换窗。</p>
    </div>
  </aside>

  <aside id="alerts-panel" class="records-panel" hidden aria-label="系统通知面板">
    <div class="records-head">
      <strong>系统通知</strong>
      <button id="alerts-close" class="ghost">关闭</button>
    </div>
    <div id="alerts-body" class="records-body">
      <p class="muted">已读不等于恢复：未解决的异常仍留在待处理。红点只统计未读的 warning/critical。</p>
    </div>
    <div class="records-foot"><button id="alerts-read-all" class="ghost">把当前列表标为已读</button></div>
  </aside>

  <div id="login-panel" class="login-panel" hidden>
    <p>首次使用：请打开服务器上的 token 文件粘贴一次（文件路径见启动日志；内容不会出现在日志里）。</p>
    <input id="token-input" type="password" placeholder="auth.token 内容" autocomplete="off" />
    <button id="token-submit">配对</button>
    <p id="login-error" class="error" hidden></p>
  </div>

  <main id="chat" hidden>
    <section id="timeline" class="timeline" aria-live="polite"></section>

    <div class="composer-wrap">
      <button id="attach-btn" class="ghost" aria-label="添加附件（图片/贴纸）">📎</button>
      <input id="attach-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden multiple />
      <textarea id="composer" rows="3" placeholder="输入…（Enter 换行；发送用右侧按钮）" spellcheck="false"></textarea>
      <button id="send-btn" class="send" disabled>发送</button>
    </div>
    <div id="attach-queue" class="attach-queue" aria-live="polite"></div>
    <div class="composer-hint">Enter 只换行；多行正文将作为一条消息完整保存</div>
    <div id="estimate-line" class="estimate-line" aria-live="polite"></div>
    <details id="estimate-detail" class="estimate-detail" hidden><summary>本次请求预估详情</summary><div id="estimate-detail-body"></div></details>
  </main>

  <dialog id="route-dialog">
    <h3>模型路由待决</h3>
    <p id="route-detail"></p>
    <div class="route-actions">
      <button id="route-edit" class="ghost">重新编辑</button>
      <button id="route-approve">同意本次路由</button>
      <button id="route-cancel" class="danger">取消</button>
    </div>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
