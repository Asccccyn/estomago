<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#faf9f5" />
  <title>estómago</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app-shell">
    <header class="topbar">
      <div class="topbar-row">
        <h1 class="brand" contenteditable="true" spellcheck="false" aria-label="聊天名称">宇宙发明小机</h1>
        <div class="header-actions">
          <button class="icon-button unavailable-control" type="button" aria-label="语音通话暂未接入" title="实时语音通话暂未接入" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3.1 5.2 2 2 0 0 1 5.1 3h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L9 11a16 16 0 0 0 4 4l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"/></svg>
          </button>
          <button id="more-btn" class="icon-button" type="button" aria-label="更多" aria-expanded="false" aria-controls="more-menu">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
          </button>
        </div>
      </div>
      <button id="model-toggle" class="model-toggle" type="button" aria-controls="model-panel" aria-expanded="false">
        <span id="model-label">char · 读取模型设置…</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
      </button>
      <div class="connection-line"><span id="runtime-badge" class="badge">连接中…</span><button id="retry-connection-btn" class="ghost" hidden>重试连接</button></div>
      <nav id="more-menu" class="header-popover more-menu" hidden aria-label="更多功能">
        <button id="workbench-btn" class="menu-item"><span class="menu-symbol"><svg viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></span><span><strong>工作台</strong><small>char给我做的小东西</small></span></button>
        <button id="records-btn" class="menu-item" hidden><span class="menu-symbol"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/><path d="M16 17h4M4 13h4"/></svg></span><span><strong>活动日志</strong><small>自动唤醒后的足迹</small></span></button>
      </nav>
      <section id="model-panel" class="header-popover model-panel" hidden aria-label="模型设置">
        <button id="model-close" class="sr-only" aria-label="关闭模型设置">关闭</button>
        <div id="runtime-settings-host"></div>
      </section>
    </header>

    <main id="chat" hidden>
      <section id="timeline" class="timeline" aria-label="聊天记录" aria-live="polite"><div id="timeline-content" class="timeline-content"></div></section>
      <footer class="composer-area">
        <div id="attach-queue" class="attach-queue" aria-live="polite"></div>
        <div class="composer-wrap">
          <div class="attachment-control">
            <button id="attach-btn" class="icon-button attach-button" aria-label="添加附件" aria-expanded="false" aria-controls="attach-menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
            <div id="attach-menu" class="composer-popover attach-menu" hidden aria-label="附件选项">
              <button id="choose-image-btn" class="attachment-option" aria-label="相册" title="相册"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></button>
              <button id="choose-camera-btn" class="attachment-option" aria-label="拍照" title="拍照"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H3v13h18V7h-4Z"/><circle cx="12" cy="13" r="3"/></svg></button>
              <button id="choose-file-btn" class="attachment-option" aria-label="文件" title="文件（支持图片）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16h16V8ZM14 2v6h6M8 13h8M8 17h6"/></svg></button>
              <button id="history-select-btn" class="attachment-option" aria-label="存档读取" title="存档读取"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v13H4ZM3 3h18v5H3ZM10 12h4"/></svg></button>
            </div>
          </div>
          <div class="composer-pill">
            <button id="context-btn" class="icon-button context-button" aria-label="查看上下文用量" aria-expanded="false" aria-controls="context-panel">
              <svg class="context-ring" viewBox="0 0 24 24" aria-hidden="true"><circle class="ring-track" cx="12" cy="12" r="8"/><circle id="context-ring-value" class="ring-value" cx="12" cy="12" r="8"/></svg>
            </button>
            <button id="voice-btn" class="icon-button voice-button" type="button" aria-label="录制语音">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg>
            </button>
            <textarea id="composer" rows="1" placeholder="回复…" aria-label="消息，Enter 换行" spellcheck="false"></textarea>
            <button id="send-btn" class="send" type="button" aria-label="发送" title="发送" disabled><span class="send-disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></span></button>
          </div>
        </div>
        <input id="attach-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden multiple />
        <input id="camera-input" type="file" accept="image/*" capture="environment" hidden />
        <div id="voice-status" class="voice-status" hidden role="status"></div>
        <div id="estimate-line" class="estimate-line" aria-live="polite"></div>
        <details id="estimate-detail" class="estimate-detail" hidden><summary>本次请求预估详情</summary><div id="estimate-detail-body"></div></details>
        <p class="sr-only">Enter 只换行；多行正文将作为一条消息完整保存，点箭头发送。</p>
      </footer>
    </main>

    <aside id="context-panel" class="records-panel context-panel" hidden aria-label="上下文用量">
      <div class="records-head"><strong>上下文窗口</strong><button id="context-close" class="icon-button close-button" aria-label="关闭上下文用量">×</button></div>
      <div id="context-summary" class="records-body">读取中…</div>
    </aside>
    <aside id="workbench-panel" class="records-panel" hidden aria-label="工作台">
      <div class="records-head"><strong>工作台</strong><button id="workbench-close" class="icon-button close-button" aria-label="关闭工作台">×</button></div>
      <div id="workbench-body" class="records-body"></div>
    </aside>
    <aside id="records-panel" class="records-panel" hidden aria-label="记录面板">
      <div class="records-head"><strong>活动日志</strong><button id="records-close" class="icon-button close-button" aria-label="关闭记录">×</button></div>
      <div id="records-body" class="records-body"><p class="muted">打开面板只查询，不会触发模型调用、记忆写入或换窗。</p></div>
      <div class="records-foot"><button id="alerts-btn" class="ghost" hidden aria-label="系统通知（异常中心）">系统通知<span id="alerts-badge" class="alerts-badge" hidden></span></button></div>
    </aside>
    <aside id="alerts-panel" class="records-panel" hidden aria-label="系统通知面板">
      <div class="records-head"><strong>系统通知</strong><button id="alerts-close" class="icon-button close-button" aria-label="关闭系统通知">×</button></div>
      <div id="alerts-body" class="records-body"><p class="muted">已读不等于恢复：未解决的异常仍留在待处理。</p></div>
      <div class="records-foot"><button id="alerts-read-all" class="ghost">把当前列表标为已读</button></div>
    </aside>
  </div>

  <dialog id="route-dialog">
    <h3>模型路由待决</h3><p id="route-detail"></p>
    <div class="route-actions"><button id="route-edit" class="ghost">重新编辑</button><button id="route-approve">同意本次路由</button><button id="route-cancel" class="danger">取消</button></div>
  </dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
